name: SwiftRelay Release CI
on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_NETCH_SHA256=$(.\sha256.ps1 .\Netch)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Netch
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Netch-${{ env.SOURCE_NETCH_SHA256 }}
          path: |
            .\Netch\bin

      - name: Cache Redirector
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v4
        with:
          key: Netch-${{ runner.os }}-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v2
        with:
          files: .\other\release\aiodns.bin

      - name: Setup Go
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: stable

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          toolchain: nightly
          profile: minimal

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: true

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1 -Configuration Release -OutputPath release -SelfContained $True
          .\build.ps1 -Configuration Release -OutputPath release-framework-dependent -SelfContained $False

      - name: Package
        shell: pwsh
        run: |
          7z a -mx9 SwiftRelay.7z release
          7z rn SwiftRelay.7z release SwiftRelay
          7z a -mx9 SwiftRelay-Framework-Dependent.7z release-framework-dependent
          7z rn SwiftRelay-Framework-Dependent.7z release-framework-dependent SwiftRelay

      - name: Checksum
        shell: pwsh
        run: |
          $hash1=(Get-FileHash SwiftRelay.7z -Algorithm SHA256).Hash.ToLower()
          $hash2=(Get-FileHash SwiftRelay-Framework-Dependent.7z -Algorithm SHA256).Hash.ToLower()
          echo "SWIFTRELAY_SHA256=$hash1" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SWIFTRELAY_FDD_SHA256=$hash2" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          draft: false
          files: |
            SwiftRelay.7z
            SwiftRelay-Framework-Dependent.7z
          body: |
            # SwiftRelay 1.0.0 正式发布 🎉

            欢迎使用 **SwiftRelay 1.0.0**！这是 SwiftRelay 的首个正式版本，在继承与革新中带来了大量功能改进、界面现代化重构与体验优化。

            ---

            ### ✨ 亮点与更新内容 (What's New)

            - **全新品牌与视觉焕新**：正式演进为 SwiftRelay，全新高清应用图标与统一设计风格。
            - **设置界面现代化重构**：
              - 优化进程模式与 TUN 模式设置排版，ICMP 协议与延时选项合并为逻辑组。
              - 修复 DNS 劫持主机标签与文本行重叠的问题。
            - **服务器配置对话框体验升级**：
              - 采用原生 Windows 风格对话框规范，提供更均衡舒适的行间距与字体渲染。
              - 文本框与端口号精准对齐，版本选择使用原生下拉菜单控件。
              - 采用标准右下角【保存】/【取消】按钮栏，并支持 `Enter` 保存与 `Esc` 退出。
              - 强化输入合法性校验，缺少地址或非法端口号时弹窗提醒并自动聚焦错误输入框。
              - 智能支持在地址栏直接粘贴 `IP:Port` 格式并自动拆分。
            - **更地道的全界面国际化 (i18n)**：
              - 补全主界面底部状态栏（如“等待命令中”）等多处未汉化文本。
              - 语言下拉列表使用各自母语名称（简体中文、繁體中文、English 等），保留“跟随系统”选项。
            - **提供无运行环境轻量依赖版**：
              - 除了包含内置完整运行时的独立版（Self-Contained），新增依赖运行库的轻量版本（Framework-Dependent），压缩包仅约 **7.5 MB**！

            ---

            ### 📦 文件说明与下载建议 / Packages

            | 文件名 / File | 大小 / Size | 说明 / Description |
            | :-- | :-- | :-- |
            | `SwiftRelay.7z` | ~71 MB | **独立版 (推荐)**：自带全部运行环境，开箱即用，免配置。 |
            | `SwiftRelay-Framework-Dependent.7z` | ~7.5 MB | **轻量依赖版**：体积小巧，需预先安装 [.NET 6.0 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/6.0)。 |

            ### 校验和 / Checksums
            | 文件名 | SHA256 |
            | :- | :- |
            | SwiftRelay.7z | ${{ env.SWIFTRELAY_SHA256 }} |
            | SwiftRelay-Framework-Dependent.7z | ${{ env.SWIFTRELAY_FDD_SHA256 }} |
